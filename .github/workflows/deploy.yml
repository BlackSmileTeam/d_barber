name: Deploy production

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dbarber-${{ github.ref }}
  cancel-in-progress: true

env:
  BACKEND_IMAGE: dbarber-backend
  FRONTEND_IMAGE: dbarber-frontend
  TELEGRAM_BOT_IMAGE: dbarber-telegram-bot
  BACKEND_HOST_PORT: 55332
  FRONTEND_HOST_PORT: 55333
  BACKEND_CONTAINER_PORT: 44315
  DEPLOY_ROOT: /opt/dbarber

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: API tests (required for publish)
        working-directory: backend
        run: |
          set -euo pipefail
          if [ -z "$(find . -name '*.Tests.csproj' -type f | head -1)" ]; then
            echo "API tests are required — no *.Tests.csproj found"
            exit 1
          fi
          dotnet restore
          dotnet build -c Release --no-restore
          dotnet test -c Release --no-build --verbosity normal

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build
        working-directory: frontend
        run: npm ci && npm run build

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          set -e
          missing=0
          [ -z "${{ secrets.PROD_HOST }}" ] && echo "Missing PROD_HOST (org)" && missing=1 || true
          [ -z "${{ secrets.PROD_USER }}" ] && echo "Missing PROD_USER (org)" && missing=1 || true
          [ -z "${{ secrets.PROD_SSH_PRIVATE_KEY }}" ] && echo "Missing PROD_SSH_PRIVATE_KEY (org)" && missing=1 || true
          [ -z "${{ secrets.PROD_SSH_PORT }}" ] && echo "Missing PROD_SSH_PORT (org)" && missing=1 || true
          [ -z "${{ secrets.JWT_KEY }}" ] && echo "Missing JWT_KEY (repo)" && missing=1 || true
          if [ -z "${{ secrets.DB_CONNECTION_STRING }}" ] && [ -z "${{ secrets.APP_CONNECTION_STRING }}" ]; then
            echo "Missing DB_CONNECTION_STRING or APP_CONNECTION_STRING (repo)"
            missing=1
          fi
          [ -z "${{ secrets.FRONTEND_PUBLIC_URL }}" ] && echo "Missing FRONTEND_PUBLIC_URL (repo) — use http://139.100.225.234:55333" && missing=1 || true
          [ "$missing" -ne 0 ] && exit 1
          echo "Secrets OK"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: ${{ env.BACKEND_IMAGE }}:latest
          platforms: linux/amd64

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest
          platforms: linux/amd64
          build-args: |
            VITE_API_URL=

      - name: Build telegram bot image
        uses: docker/build-push-action@v6
        with:
          context: ./Barber.TelegramBot
          file: ./Barber.TelegramBot/Dockerfile
          push: false
          load: true
          tags: ${{ env.TELEGRAM_BOT_IMAGE }}:latest
          platforms: linux/amd64

      - name: Save images to workspace
        run: |
          mkdir -p artifacts
          docker save ${{ env.BACKEND_IMAGE }}:latest | gzip > artifacts/${{ env.BACKEND_IMAGE }}.tar.gz
          docker save ${{ env.FRONTEND_IMAGE }}:latest | gzip > artifacts/${{ env.FRONTEND_IMAGE }}.tar.gz
          docker save ${{ env.TELEGRAM_BOT_IMAGE }}:latest | gzip > artifacts/${{ env.TELEGRAM_BOT_IMAGE }}.tar.gz
          ls -lh artifacts/

      - name: Upload images to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          source: "artifacts/${{ env.BACKEND_IMAGE }}.tar.gz,artifacts/${{ env.FRONTEND_IMAGE }}.tar.gz,artifacts/${{ env.TELEGRAM_BOT_IMAGE }}.tar.gz"
          target: "/tmp/dbarber-images"
          strip_components: 1
          overwrite: true

      - name: Load images and run containers
        uses: appleboy/ssh-action@v1.2.5
        env:
          JWT_ISSUER: ${{ secrets.JWT_ISSUER }}
          JWT_AUDIENCE: ${{ secrets.JWT_AUDIENCE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          command_timeout: 30m
          envs: JWT_ISSUER,JWT_AUDIENCE,TELEGRAM_BOT_TOKEN,TELEGRAM_ADMIN_CHAT_ID
          script: |
            set -euo pipefail
            DEPLOY_ROOT="${{ env.DEPLOY_ROOT }}"
            BACKEND_IMAGE="${{ env.BACKEND_IMAGE }}"
            FRONTEND_IMAGE="${{ env.FRONTEND_IMAGE }}"
            TELEGRAM_BOT_IMAGE="${{ env.TELEGRAM_BOT_IMAGE }}"
            BACKEND_HOST_PORT="${{ env.BACKEND_HOST_PORT }}"
            FRONTEND_HOST_PORT="${{ env.FRONTEND_HOST_PORT }}"
            BACKEND_CONTAINER_PORT="${{ env.BACKEND_CONTAINER_PORT }}"
            JWT_ISSUER="${JWT_ISSUER:-DBarberApi}"
            JWT_AUDIENCE="${JWT_AUDIENCE:-DBarberClient}"

            mkdir -p "$DEPLOY_ROOT/wwwroot/uploads" "$DEPLOY_ROOT/logs"
            CONN='${{ secrets.DB_CONNECTION_STRING }}'
            if [ -z "$CONN" ]; then CONN='${{ secrets.APP_CONNECTION_STRING }}'; fi

            test -f "/tmp/dbarber-images/${BACKEND_IMAGE}.tar.gz"
            test -f "/tmp/dbarber-images/${FRONTEND_IMAGE}.tar.gz"
            test -f "/tmp/dbarber-images/${TELEGRAM_BOT_IMAGE}.tar.gz"
            docker load < "/tmp/dbarber-images/${BACKEND_IMAGE}.tar.gz"
            docker load < "/tmp/dbarber-images/${FRONTEND_IMAGE}.tar.gz"
            docker load < "/tmp/dbarber-images/${TELEGRAM_BOT_IMAGE}.tar.gz"
            rm -f "/tmp/dbarber-images/${BACKEND_IMAGE}.tar.gz" "/tmp/dbarber-images/${FRONTEND_IMAGE}.tar.gz" "/tmp/dbarber-images/${TELEGRAM_BOT_IMAGE}.tar.gz"

            # Same Docker network as bebochka so UFW already allows MySQL (172.18.0.0/16).
            # Do NOT stop/recreate bebochka containers — only attach dbarber_* to the network.
            EDGE_NET=bebochka-edge
            if ! docker network inspect "$EDGE_NET" >/dev/null 2>&1; then
              echo "Network $EDGE_NET not found — creating dbarber-net and opening MySQL for its subnet"
              docker network inspect dbarber-net >/dev/null 2>&1 || docker network create dbarber-net
              EDGE_NET=dbarber-net
              SUBNET=$(docker network inspect dbarber-net --format '{{range .IPAM.Config}}{{.Subnet}}{{end}}')
              if [ -n "$SUBNET" ]; then
                sudo ufw allow from "$SUBNET" to any port 3306 proto tcp comment 'dbarber-net -> MySQL' || true
              fi
            fi

            docker stop "$BACKEND_IMAGE" 2>/dev/null || true
            docker rm -f "$BACKEND_IMAGE" 2>/dev/null || true
            docker run -d \
              --name "$BACKEND_IMAGE" \
              --restart unless-stopped \
              --network "$EDGE_NET" \
              --add-host=host.docker.internal:host-gateway \
              -p "${BACKEND_HOST_PORT}:${BACKEND_CONTAINER_PORT}" \
              -v "$DEPLOY_ROOT/wwwroot:/app/wwwroot" \
              -e ASPNETCORE_ENVIRONMENT=Production \
              -e Database__Provider=MySql \
              -e ConnectionStrings__DefaultConnection="$CONN" \
              -e Jwt__Key='${{ secrets.JWT_KEY }}' \
              -e Jwt__Issuer="$JWT_ISSUER" \
              -e Jwt__Audience="$JWT_AUDIENCE" \
              -e Telegram__BotToken="${TELEGRAM_BOT_TOKEN:-}" \
              -e Telegram__AdminChatId="${TELEGRAM_ADMIN_CHAT_ID:-}" \
              -e App__FrontendPublicUrl='${{ secrets.FRONTEND_PUBLIC_URL }}' \
              "$BACKEND_IMAGE:latest"

            docker stop "$FRONTEND_IMAGE" 2>/dev/null || true
            docker rm -f "$FRONTEND_IMAGE" 2>/dev/null || true
            docker run -d \
              --name "$FRONTEND_IMAGE" \
              --restart unless-stopped \
              --network "$EDGE_NET" \
              -p "${FRONTEND_HOST_PORT}:80" \
              "$FRONTEND_IMAGE:latest"

            # Telegram bot: long-polling process (no published ports). Needs token to stay active.
            docker stop "$TELEGRAM_BOT_IMAGE" 2>/dev/null || true
            docker rm -f "$TELEGRAM_BOT_IMAGE" 2>/dev/null || true
            docker run -d \
              --name "$TELEGRAM_BOT_IMAGE" \
              --restart unless-stopped \
              --network "$EDGE_NET" \
              -e TelegramBot__Token="${TELEGRAM_BOT_TOKEN:-}" \
              -e TELEGRAM_BOT_TOKEN="${TELEGRAM_BOT_TOKEN:-}" \
              -e Api__BaseUrl="http://${BACKEND_IMAGE}:${BACKEND_CONTAINER_PORT}/api" \
              -e API_BASE_URL="http://${BACKEND_IMAGE}:${BACKEND_CONTAINER_PORT}/api" \
              "$TELEGRAM_BOT_IMAGE:latest"

            echo "Waiting for API health..."
            CODE=000
            for i in $(seq 1 30); do
              CODE=$(curl -sS -o /tmp/dbarber-health.txt -w "%{http_code}" --max-time 5 "http://127.0.0.1:${BACKEND_HOST_PORT}/api/health" || echo 000)
              echo "attempt $i => HTTP $CODE"
              if [ "$CODE" = "200" ]; then
                break
              fi
              sleep 2
            done
            docker ps --filter name=dbarber --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
            docker ps --filter name=bebochka --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
            cat /tmp/dbarber-health.txt 2>/dev/null || true
            echo
            if [ "$CODE" != "200" ]; then
              docker logs --tail 120 "$BACKEND_IMAGE" || true
              exit 1
            fi
            echo "Telegram bot logs (tail):"
            docker logs --tail 40 "$TELEGRAM_BOT_IMAGE" || true
            echo "bebochka containers left running (not stopped by this deploy)"
      - name: Summary
        run: |
          {
            echo "## D_Barber deploy"
            echo "- API: \`http://${{ secrets.PROD_HOST }}:${{ env.BACKEND_HOST_PORT }}\`"
            echo "- Frontend: \`http://${{ secrets.PROD_HOST }}:${{ env.FRONTEND_HOST_PORT }}\`"
            echo "- Telegram bot container: \`${{ env.TELEGRAM_BOT_IMAGE }}\` (needs TELEGRAM_BOT_TOKEN secret)"
            echo "- FRONTEND_PUBLIC_URL secret must match frontend URL"
          } >> "$GITHUB_STEP_SUMMARY"
